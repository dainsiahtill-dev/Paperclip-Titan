<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <meta name="apple-mobile-web-app-title" content="Paperclip" />
    <title>Paperclip</title>
    <link rel="stylesheet" href="/src/index.css" />
    <!-- PAPERCLIP_RUNTIME_BRANDING_START -->
    <!-- PAPERCLIP_RUNTIME_BRANDING_END -->
    <!-- PAPERCLIP_FAVICON_START -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- PAPERCLIP_FAVICON_END -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
    <script>
      (() => {
        const key = "paperclip.theme";
        const darkThemeColor = "#18181b";
        const lightThemeColor = "#ffffff";
        try {
          const stored = window.localStorage.getItem(key);
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const fallback = prefersDark ? "dark" : "light";
          const theme = stored === "light" || stored === "dark" ? stored : fallback;
          const isDark = theme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", isDark ? darkThemeColor : lightThemeColor);
          }
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><div class="app-bootstrap" role="status">Paperclip 正在加载…</div></div>
    <script>
      (() => {
        function showEntryFailure() {
        const root = document.getElementById("root");
        if (!root || (!root.matches(".app-bootstrap") && !root.querySelector(".app-bootstrap"))) return;
        root.replaceChildren();
        const message = document.createElement("p");
        message.setAttribute("role", "alert");
        message.textContent = "Paperclip 加载失败。请检查连接后重新加载。";
        const retry = document.createElement("button");
        retry.type = "button";
        retry.textContent = "重新加载";
        retry.addEventListener("click", () => window.location.reload());
        root.className = "app-bootstrap";
        root.append(message, retry);

        }
        window.addEventListener("paperclip:entry-load-failed", showEntryFailure);
        window.addEventListener("error", (event) => {
          const failedModule = event.target instanceof HTMLScriptElement && event.target.type === "module";
          const earlyException = event instanceof ErrorEvent && document.getElementById("root")?.querySelector(".app-bootstrap");
          if (failedModule || earlyException) showEntryFailure();
        }, true);
      })();
    </script>
    <script type="module">
      import("/src/main.tsx").catch(() => window.dispatchEvent(new Event("paperclip:entry-load-failed")));
    </script>
  </body>
</html>
